<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><main class="w-full flex items-center justify-center min-h-screen bg-surface"><div class="flex flex-col w-full h-full items-center justify-center p-4">
<div class="relative w-full max-w-md bg-surface-container-lowest rounded-xl p-8 md:p-12 shadow-sm transition-shadow duration-300 hover:shadow-md">
<div class="mb-10 text-center">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">QuizFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<form class="space-y-6">
<div class="flex bg-surface-container p-1 rounded-lg mb-8 relative">
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-md shadow-sm transition-transform duration-300 ease-in-out" id="role-slider"></div>
<button class="relative z-10 flex-1 py-2 text-center font-label-sm text-label-sm text-primary transition-colors duration-200" id="btn-student" onclick="setRole('student')" type="button">Student</button>
<button class="relative z-10 flex-1 py-2 text-center font-label-sm text-label-sm text-on-surface-variant transition-colors duration-200" id="btn-admin" onclick="setRole('admin')" type="button">Administrator</button>
</div>
<div class="space-y-1 relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant transition-colors group-focus-within:text-secondary" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-secondary pointer-events-none transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 transition-all duration-200 outline-none hover:shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus:shadow-[0_0_0_2px_rgba(0,88,190,0.2)] focus:bg-surface-container-low" id="email" placeholder="name@institute.edu" required="" type="email"/>
</div>
</div>
<div class="space-y-1 relative group">
<div class="flex justify-between items-center">
<label class="block font-label-sm text-label-sm text-on-surface-variant transition-colors group-focus-within:text-secondary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-secondary pointer-events-none transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-10 transition-all duration-200 outline-none hover:shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus:shadow-[0_0_0_2px_rgba(0,88,190,0.2)] focus:bg-surface-container-low" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-secondary text-on-secondary font-headline-md text-headline-md rounded-lg py-3 mt-4 transition-all duration-200 hover:bg-secondary-container hover:shadow-[0_4px_12px_rgba(0,88,190,0.15)] active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
<span>Login</span>
<span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
</div>
<div class="mt-8 text-center max-w-sm">
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">shield</span>
            Secure Institutional Access
        </p>
</div>
</div>
<script>
    function setRole(role) {
        const slider = document.getElementById('role-slider');
        const btnStudent = document.getElementById('btn-student');
        const btnAdmin = document.getElementById('btn-admin');
        const emailInput = document.getElementById('email');

        if (role === 'admin') {
            slider.style.transform = 'translateX(100%)';
            btnAdmin.classList.remove('text-on-surface-variant');
            btnAdmin.classList.add('text-primary');
            btnStudent.classList.remove('text-primary');
            btnStudent.classList.add('text-on-surface-variant');
            emailInput.placeholder = "admin@institute.edu";
        } else {
            slider.style.transform = 'translateX(0)';
            btnStudent.classList.remove('text-on-surface-variant');
            btnStudent.classList.add('text-primary');
            btnAdmin.classList.remove('text-primary');
            btnAdmin.classList.add('text-on-surface-variant');
            emailInput.placeholder = "student@institute.edu";
        }
    }

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            toggleIcon.textContent = 'visibility';
        }
    }
</script></main></body></html>
